<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutter Demo Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }
        h1 {
            color: #1976d2;
            font-size: 32px;
            margin-top: 80px;
            font-weight: 400;
        }
        p {
            font-size: 16px;
            color: #5f6368;
            margin: 24px 0;
        }
        #count {
            font-size: 72px;
            color: #202124;
            margin: 32px 0;
            font-weight: 300;
        }
        button {
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
            text-transform: uppercase;
            font-weight: 500;
        }
        button:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>
    <h1>Flutter Demo Home Page</h1>
    <p>You have pushed the button this many times:</p>
    <div id="count">0</div>
    <button onclick="incrementCounter()">Click Me</button>

    <script>
        let counter = 0;
        function incrementCounter() {
            counter++;
            document.getElementById('count').innerText = counter;
        }
    </script>
</body>
</html>
