<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutter Demo Home Page</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 80px; background: #fafafa; }
        h1 { color: #1976d2; font-size: 32px; font-weight: 400; }
        p { font-size: 16px; color: #5f6368; margin: 24px 0; }
        #count { font-size: 72px; color: #202124; margin: 32px 0; font-weight: 300; }
        button { background: #1976d2; color: white; border: none; border-radius: 4px; padding: 10px 24px; font-size: 14px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <h1>Flutter Demo Home Page</h1>
    <p>You have pushed the button this many times:</p>
    <div id="count">0</div>
    <button onclick="incrementCounter()">Click Me</button>
    <script>
        let counter = 0;
        function incrementCounter() {
            counter++;
            document.getElementById('count').innerText = counter;
        }
    </script>
</body>
</html>
